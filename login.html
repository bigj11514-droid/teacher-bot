<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="teacher.css" />
    <title>Student Login | Y_Cohde</title>
  </head>
  <body class="login-page">
    <header class="simple-site-header"><a href="login.html" class="simple-brand">Y_Cohde</a><nav class="simple-nav" id="simple-nav"><a href="login.html">Log in</a><a href="-index.html">Courses</a><a href="index.html">Dashboard</a></nav></header>
    <main class="login-card">
      <div class="brand-mark">Y</div>
      <h1>Welcome to Y_Cohde Academy</h1>
      <p>Log in to open your personal learning dashboard.</p>
      <form class="login-form" id="login-form">
        <label>Full name<input id="student-name" type="text" autocomplete="name" placeholder="Enter your name" required /></label>
        <label>Student email<input id="student-email" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
        <label>Password<input id="student-password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="4" /></label>
        <p id="login-error" class="login-error" role="alert">Forgot your password?<a href="" target="_self" rel="noopener noreferrer">Sign In</a></p>
        <button class="btn" type="submit">Log in to dashboard</button>
      </form>
    </main>
    <script src="shared.js"></script>
    <script>
      setupSimpleHamburgerMenu();
      if (getStudentSession()) window.location.replace("index.html");
      byId("login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = byId("student-name").value.trim();
        const email = byId("student-email").value.trim();
        const password = byId("student-password").value;
        if (!name || !email || password.length < 4) {
          setText("login-error", "Enter your name, a valid email, and a password of at least 4 characters.");
          return;
        }
        saveStudentSession({ name, email });
        window.location.replace("index.html");
      });
    </script>
  </body>
</html>
