<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="teacher.css" />
    <title>Log in | Y_Cohde</title>
    <meta name="robots" content="noindex, follow" />
  </head>
  <body class="login-page">
    <header class="simple-site-header">
      <a href="login.html" class="simple-brand">Y_Cohde</a>
      <nav class="simple-nav" id="simple-nav">
        <a href="login.html">Log in</a><a href="-index.html">Courses</a
        ><a href="index.html">Dashboard</a>
      </nav>
    </header>
    <main class="login-card" id="login-card" hidden aria-hidden="true">
      <div class="brand-mark">Y</div>
      <h1>Welcome to Y_Cohde Academy</h1>
      <p>Log in to open your learning, teacher, or administrator space.</p>
      <form class="login-form" id="login-form">
        <label
          >Full name<input
            id="student-name"
            type="text"
            autocomplete="name"
            placeholder="Enter your name"
            required
        /></label>
        <label
          >Student email<input
            id="student-email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
        /></label>
        <label
          >Account type<select id="account-role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="administrator">Administrator</option>
          </select></label
        >
        <label
          >Occupation<input
            id="profile-occupation"
            type="text"
            placeholder="e.g. Mathematics teacher"
        /></label>
        <label
          >School name<input
            id="profile-school"
            type="text"
            placeholder="Enter your school name"
        /></label>
        <label
          >Profile picture URL<input
            id="profile-picture"
            type="url"
            placeholder="https://example.com/photo.jpg"
        /></label>
        <label
          >Or choose a profile photo<input
            id="profile-picture-file"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
          />
          <small>Your photo is saved to your account and shown in your profile pill (5 MB max).</small>
        </label>
        <label
          >Department<select id="student-department">
            <option value="basic">Basic Department</option>
            <option value="jhs">Junior High Department</option>
            <option value="shs">Senior High Department</option>
          </select></label
        >
        <label
          >Password<input
            id="student-password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
            minlength="4"
        /></label>
        <p id="login-error" class="login-error" role="alert">
          Forgot your password?<a
            href=""
            target="_self"
            rel="noopener noreferrer"
            >Sign In</a
          >
        </p>
        <button class="btn" type="submit">Log in to dashboard</button>
        <button class="btn login-mode-toggle" id="create-account-toggle" type="button">Create a student account</button>
      </form>
    </main>
    <!-- FIRST-VISIT ROLE CHOICE: shown before the login fields are available. -->
    <div
      class="role-choice-modal"
      id="role-choice-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="role-choice-title"
    >
      <section class="role-choice-card">
        <div class="brand-mark">Y</div>
        <h1 id="role-choice-title">Welcome to Y_Cohde Academy</h1>
        <p>Before you log in, tell us which space you need.</p>
        <div class="role-choice-actions">
          <button type="button" class="role-choice-btn" data-role="student">
            <strong>Student</strong
            ><span>Start learning and complete lessons.</span>
          </button>
          <button type="button" class="role-choice-btn" data-role="teacher">
            <strong>Teacher</strong
            ><span>Manage learning content for approval.</span>
          </button>
          <button
            type="button"
            class="role-choice-btn"
            data-role="administrator"
          >
            <strong>Administrator</strong
            ><span>Manage the school platform and content.</span>
          </button>
        </div>
      </section>
    </div>
    <script>
      const menuButton = document.querySelector(".simple-menu-toggle");
      const navigation = document.getElementById("simple-nav");

      // Only run menu code if the menu button exists
      if (menuButton && navigation) {
        menuButton.addEventListener("click", () => {
          const open = navigation.classList.toggle("open");
          menuButton.setAttribute("aria-expanded", open);
        });
      }

      const sessionKey = "ycohdeStudentSession";
      const roleChoiceKey = "ycohdeLoginRoleChoice";
      const loginCard = document.getElementById("login-card");
      const roleModal = document.getElementById("role-choice-modal");
      const accountRole = document.getElementById("account-role");
      const form = document.getElementById("login-form");
      const submitButton = form.querySelector('button[type="submit"]');
      const createButton = document.getElementById("create-account-toggle");
      let creatingAccount = false;

      // FIRST-VISIT ROLE CHOICE: choose a role before the login fields open.
      // This is stored only for the current browser tab/session, not as an account.
      function openLoginForRole(role) {
        accountRole.value = role;
        sessionStorage.setItem(roleChoiceKey, role);
        roleModal.hidden = true;
        loginCard.hidden = false;
        loginCard.setAttribute("aria-hidden", "false");
        document.getElementById("student-name").focus();
        updateAccountMode();
      }

      function updateAccountMode() {
        const isStudent = accountRole.value === "student";
        if (!isStudent) creatingAccount = false;
        createButton.hidden = !isStudent;
        document.getElementById("student-name").required = creatingAccount;
        document.getElementById("student-department").required = creatingAccount;
        document.getElementById("profile-picture").required = false;
        submitButton.textContent = creatingAccount ? "Create account" : "Log in to dashboard";
        createButton.textContent = creatingAccount ? "I already have an account" : "Create a student account";
        document.querySelector(".login-card > p").textContent = creatingAccount
          ? "Create your student account to save your learning and return any time."
          : "Log in to open your learning, teacher, or administrator space.";
      }

      createButton.addEventListener("click", () => {
        creatingAccount = !creatingAccount;
        updateAccountMode();
      });
      accountRole.addEventListener("change", updateAccountMode);

      // Restore the account from the server cookie; localStorage alone is not authentication.
      async function restoreServerSession() {
        if (localStorage.getItem(sessionKey)) {
          try {
            const response = await fetch("/api/auth/me", { credentials: "same-origin" });
            const result = await response.json();
            if (response.ok && result.user) {
              localStorage.setItem(sessionKey, JSON.stringify(result.user));
              const role = result.user.role;
              window.location.replace(role === "administrator" ? "admin.html" : role === "teacher" ? "teacher.html" : "index.html");
              return;
            }
          } catch (error) {
            console.warn("Could not restore the server session:", error);
          }
          localStorage.removeItem(sessionKey);
        }
        const savedRoleChoice = sessionStorage.getItem(roleChoiceKey);
        if (["student", "teacher", "administrator"].includes(savedRoleChoice)) {
          openLoginForRole(savedRoleChoice);
        }
      }
      restoreServerSession();

      document.querySelectorAll("[data-role]").forEach((button) => {
        button.addEventListener("click", () =>
          openLoginForRole(button.dataset.role),
        );
      });

      // Login form
      form.addEventListener("submit", async (event) => {
          event.preventDefault();

          const name = document.getElementById("student-name").value.trim();
          const email = document.getElementById("student-email").value.trim();
          const password = document.getElementById("student-password").value;
          const occupation = document
            .getElementById("profile-occupation")
            .value.trim();
          const school = document.getElementById("profile-school").value.trim();
          const profilePicture = document
            .getElementById("profile-picture")
            .value.trim();
          const pictureFile = document.getElementById("profile-picture-file").files[0];

          const error = document.getElementById("login-error");

          const role = accountRole.value;
          if (!email || (creatingAccount && !name) || password.length < (creatingAccount ? 8 : 1)) {
            error.textContent = creatingAccount
              ? "Enter your name and email, and use a password with at least 8 characters."
              : "Enter your email and password.";
            return;
          }
          if (pictureFile && (!pictureFile.type.startsWith("image/") || pictureFile.size > 5 * 1024 * 1024)) {
            error.textContent = "Choose an image no larger than 5 MB.";
            return;
          }
          const department =
            document.getElementById("student-department").value;
          error.textContent = "";
          submitButton.disabled = true;
          try {
            const response = await fetch(creatingAccount ? "/api/auth/register" : "/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify(creatingAccount
                ? { full_name: name, email, password, department, profile_picture: profilePicture, occupation, school }
                : { email, password, role }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || "Unable to sign in.");
            let user = result.user;
            if (pictureFile) {
              const uploadData = new FormData();
              uploadData.append("profile_picture", pictureFile);
              const uploadResponse = await fetch("/api/auth/profile-picture", {
                method: "POST",
                credentials: "same-origin",
                body: uploadData,
              });
              const uploadResult = await uploadResponse.json();
              if (!uploadResponse.ok) throw new Error(uploadResult.message || "Your account signed in, but the profile photo could not be saved.");
              user = uploadResult.user;
            }
            localStorage.setItem(sessionKey, JSON.stringify(user));
            window.location.replace(user.role === "administrator" ? "admin.html" : user.role === "teacher" ? "teacher.html" : "index.html");
          } catch (requestError) {
            error.textContent = requestError.message || "Could not reach the account server. Start the Python backend and try again.";
          } finally {
            submitButton.disabled = false;
          }
        });
    </script>
  </body>
</html>
