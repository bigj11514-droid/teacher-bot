<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="teacher.css" />
    <title>Choose Department</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a
          class="sidebar-brand brand-link"
          href="https://bigj11514-droid.github.io/Y_Cohde-officail-landing-page-/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="brand-mark">Y</div>
          <div>
            <h3>Y_Cohde</h3>
            <p>Future-ready learning</p>
          </div>
        </a>
        <button
          class="menu-toggle"
          id="menu-toggle"
          type="button"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          ☰
        </button>
        <nav class="site-nav" id="site-nav">
          <a href="index.html" class="nav-item"
            ><span>▣</span><span>Dashboard</span></a
          >
          <a href="-index.html" class="nav-item"
            ><span>◧</span><span>Courses</span></a
          >
          <a href="department.html" class="nav-item active"
            ><span>◨</span><span>Departments</span></a
          >
          <a href="index.html#about-section" class="nav-item"
            ><span>✦</span><span>Why Y_Cohde</span></a
          >
          <a href="index.html#share-section" class="nav-item"
            ><span>★</span><span>Reviews</span></a
          >
          <a href="index.html#subscribe-section" class="nav-item"
            ><span>✉</span><span>Study plans</span></a
          >
          <a href="https://wa.me/0207918169" class="nav-item"
            ><span>☏</span><span>Contact</span></a
          >
        </nav>
        <div class="sidebar-card">
          <p>Department flow</p>
          <strong>Switch with ease</strong>
          <a href="-index.html" class="small-btn">View subjects</a>
        </div>
      </aside>

      <div class="main-panel">
        <header class="site-header">
          <div class="header-inner">
            <div class="search-box">
              <span>🔎</span>
              <input type="text" placeholder="Search departments or classes" />
            </div>
            <div class="header-actions">
              <button class="icon-btn" aria-label="Notifications">🔔</button>
              <div class="profile-pill">
                <span>ES</span>
                <div>
                  <strong>Emmanuel</strong>
                  <small>Student</small>
                </div>
              </div>
            </div>
          </div>
        </header>

        <main class="main-content">
          <div class="container1">
            <section class="page-panel">
              <div class="panel-header">
                <p class="eyebrow">Department selection</p>
                <h2 class="sub-txt">Select your department and class</h2>
              </div>
              <div class="class-picker department-card">
                <label for="department-select">Department</label>
                <select id="department-select">
                  <option value="basic">Basic Department</option>
                  <option value="jhs">Junior High Department</option>
                  <option value="shs">Senior High Department</option>
                </select>
                <label for="class-select">Class</label>
                <select id="class-select"></select>
                <label
                  for="course-select"
                  id="course-label"
                  style="display: none"
                  >SHS Course</label
                >
                <select id="course-select" style="display: none">
                  <option value="general-arts">General Arts</option>
                  <option value="general-science">General Science</option>
                  <option value="business">Business</option>
                  <option value="home-economics">Home Economics</option>
                  <option value="visual-arts">Visual Arts</option>
                </select>
                <button id="continue-btn" class="small-btn">Continue</button>
              </div>
              <div class="design" id="designs">
                <p id="department-message" class="select">
                  Choose your department and class to continue.
                </p>
                <div
                  id="department-visual"
                  class="department-visual"
                  aria-live="polite"
                ></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="teacherbot.js"></script>
  </body>
</html>
