<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Friendly Y_Cohde learning robot</title>
  <desc id="desc">A friendly white learning robot glowing in a navy, cyan and blue digital space.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071724"/>
      <stop offset=".55" stop-color="#0a2b43"/>
      <stop offset="1" stop-color="#102d55"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1fdff"/>
      <stop offset="1" stop-color="#8dcbe2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65f0ff"/>
      <stop offset="1" stop-color="#398df6"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#51dfff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#51dfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-.8" y="-.8" width="2.6" height="2.6">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
