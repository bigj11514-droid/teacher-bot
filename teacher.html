<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="teacher.css"><title>Teacher Studio | Y_Cohde</title></head>
<body><div class="app-shell"><aside class="sidebar"><a class="sidebar-brand brand-link" href="index.html"><div class="brand-mark">Y</div><div><h3>Y_Cohde</h3><p>Teacher studio</p></div></a><nav class="site-nav" id="site-nav"><a href="index.html" class="nav-item"><span>Dashboard</span></a><a href="teacher.html" class="nav-item active"><span>Teacher studio</span></a></nav></aside><div class="main-panel"><header class="site-header"><div class="header-inner"><div class="search-box"><input value="Create learning content" readonly></div><button class="menu-toggle header-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button></div></header><main class="main-content"><div class="container1" id="teacher-studio"><section class="page-panel content-studio"><p class="eyebrow">Teacher contribution</p><h2>Edit lessons, videos, topics, and checks</h2><p>Choose a department and class first. Your lesson, video, and five learning-check questions are sent for approval.</p><form id="content-studio-form" class="content-form"><label>Department<select id="content-department"></select></label><label>Class<select id="content-class"></select></label><label>Subject<select id="content-subject"></select></label><label>Main topic<select id="content-topic"></select></label><label>Subtopic<select id="content-subtopic"></select></label><label>Lesson text<textarea id="content-lesson" required></textarea></label><label>Examples (JSON list)<textarea id="content-examples" required></textarea></label><label>Five pop-up questions (JSON list)<textarea id="content-questions" required></textarea></label><label>YouTube video link or embed link<input id="content-video" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><button class="btn" type="submit">Send changes for approval</button><p id="content-status" class="feedback-text"></p></form></section><section class="page-panel"><p class="eyebrow">Learning support</p><h2>Students needing attention</h2><div id="performance-report" class="contributor-list"></div></section></div></main></div></div><script src="teacherbot.js"></script></body></html>
