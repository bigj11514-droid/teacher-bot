<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="teacher.css"><title>Teacher Studio | Y_Cohde</title></head>
<body><div class="app-shell"><aside class="sidebar"><a class="sidebar-brand brand-link" href="index.html"><div class="brand-mark">Y</div><div><h3>Y_Cohde</h3><p>Teacher studio</p></div></a><nav class="site-nav" id="site-nav"><a href="index.html" class="nav-item"><span>▣</span><span>Dashboard</span></a><a href="teacher.html" class="nav-item active"><span>🎥</span><span>Teacher studio</span></a></nav></aside><div class="main-panel"><header class="site-header"><div class="header-inner"><div class="search-box"><span>🔎</span><input value="Create learning content" readonly></div><button class="menu-toggle header-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button></div></header><main class="main-content"><div class="container1" id="teacher-studio"><section class="page-panel content-studio"><p class="eyebrow">Teacher contribution</p><h2>Add a lesson video, text, and examples</h2><p>Your YouTube link and examples will be shown to students inside the lesson.</p><form id="content-studio-form" class="content-form"><label>Subject<select id="content-subject"></select></label><label>Main topic<select id="content-topic"></select></label><label>Subtopic<select id="content-subtopic"></select></label><label>Lesson text<textarea id="content-lesson" required></textarea></label><label>Examples (JSON list)<textarea id="content-examples" required></textarea></label><label>YouTube video link or embed link<input id="content-video" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><button class="btn" type="submit">Save lesson and video</button><p id="content-status" class="feedback-text"></p></form></section></div></main></div></div><script src="teacherbot.js"></script></body></html>
