<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="teacher.css"><title>Administrator Panel | Y_Cohde</title></head>
<body><div class="app-shell"><aside class="sidebar"><a class="sidebar-brand brand-link" href="index.html"><div class="brand-mark">Y</div><div><h3>Y_Cohde</h3><p>Administrator</p></div></a><nav class="site-nav" id="site-nav"><a href="index.html" class="nav-item"><span>▣</span><span>Dashboard</span></a><a href="admin.html" class="nav-item active"><span>⚙</span><span>Administrator panel</span></a><a href="teacher.html" class="nav-item"><span>🎥</span><span>Teacher studio</span></a></nav></aside><div class="main-panel"><header class="site-header"><div class="header-inner"><div class="search-box"><span>🔎</span><input value="Manage Y_Cohde content" readonly></div><button class="menu-toggle header-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button></div></header><main class="main-content"><div class="container1" id="administrator-panel"><section class="page-panel content-studio"><p class="eyebrow">Content manager</p><h2>Edit lessons, main topics, subtopics, examples, and videos</h2><form id="content-studio-form" class="content-form"><label>Subject<select id="content-subject"></select></label><label>Choose main topic<select id="content-topic"></select></label><label>New main topic name<input id="content-topic-name" required></label><label>Choose subtopic<select id="content-subtopic"></select></label><label>New subtopic name<input id="content-subtopic-name" required></label><label>Lesson text<textarea id="content-lesson" required></textarea></label><label>Examples (JSON list)<textarea id="content-examples" required></textarea></label><label>YouTube video link or embed link<input id="content-video" type="url" placeholder="https://www.youtube.com/watch?v=..."></label><button class="btn" type="submit">Save changes</button><p id="content-status" class="feedback-text"></p></form></section><section class="page-panel"><p class="eyebrow">Approval queue</p><h2>Teacher edits awaiting your approval</h2><div id="pending-content" class="contributor-list"></div></section><section class="page-panel"><p class="eyebrow">Teacher contributors</p><h2>Teachers contributing to your site</h2><div id="contributing-teachers" class="contributor-list"></div></section></div></main></div></div><script src="teacherbot.js"></script></body></html>
